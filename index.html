<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Spicy Date 🌶️</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen flex flex-col items-center p-4 pb-24 select-none">

    <!-- هدر برنامه -->
    <header class="w-full max-w-md flex justify-between items-center py-3 border-b border-slate-800/80 mb-4">
        <h1 class="text-2xl font-black text-transparent bg-clip-text bg-gradient-to-r from-rose-500 via-pink-500 to-amber-400">
            Spicy Date 🌶️
        </h1>
        <span id="vip-status-badge" class="text-xs font-bold px-3 py-1 bg-amber-500/10 text-amber-400 rounded-full border border-amber-500/30 flex items-center gap-1">
            ⭐️ کاربر عادی
        </span>
    </header>

    <!-- محتوای صفحات -->
    <main class="w-full max-w-md flex-1 flex flex-col items-center justify-start">
        
        <!-- تب ۱: اکسپلور و فیلترها -->
        <section id="tab-explore" class="w-full">
            <div id="cards-container" class="w-full">
                <div class="flex flex-col items-center justify-center py-12 text-slate-500">
                    <div class="w-8 h-8 border-2 border-rose-500 border-t-transparent rounded-full animate-spin mb-3"></div>
                    <p class="text-sm font-medium">در حال دریافت اطلاعات...</p>
                </div>
            </div>
        </section>

        <!-- تب ۲: علاقه‌مندی‌ها (Favorites / Likes) -->
        <section id="tab-favorites" class="w-full hidden">
            <h2 class="text-lg font-bold text-slate-200 mb-4">❤️ کسانی که لایک کرده‌اید</h2>
            <div id="favorites-container" class="space-y-3">
                <p class="text-xs text-slate-500 text-center py-8">لیست علاقه‌مندی‌های شما خالی است.</p>
            </div>
        </section>

        <!-- تب ۳: گفتگوها و Matchها -->
        <section id="tab-chats" class="w-full hidden">
            <div class="bg-slate-900/50 border border-slate-800 rounded-3xl p-6 text-center">
                <p class="text-slate-400 text-sm">هنوز مسابقه‌ای (Match) شکل نگرفته است.</p>
            </div>
        </section>

        <!-- تب ۴: پروفایل پیشرفته و VIP -->
        <section id="tab-profile" class="w-full hidden">
            <!-- محتوای دینامیک از app.js رندر می‌شود -->
        </section>

    </main>

    <!-- منوی پایینی ۵ تایی -->
    <nav class="fixed bottom-0 left-0 right-0 bg-slate-900/95 border-t border-slate-800/80 backdrop-blur-lg px-3 py-2 z-50 flex justify-around items-center max-w-md mx-auto">
        <button onclick="switchTab('explore')" id="nav-explore" class="flex flex-col items-center gap-1 text-rose-500 font-bold">
            <span class="text-xl">🔥</span>
            <span class="text-[10px]">کارت‌ها</span>
        </button>

        <button onclick="switchTab('favorites')" id="nav-favorites" class="flex flex-col items-center gap-1 text-slate-400">
            <span class="text-xl">❤️</span>
            <span class="text-[10px]">علاقه‌مندی‌ها</span>
        </button>

        <button onclick="switchTab('chats')" id="nav-chats" class="flex flex-col items-center gap-1 text-slate-400">
            <span class="text-xl">💬</span>
            <span class="text-[10px]">گفتگوها</span>
        </button>

        <button onclick="switchTab('profile')" id="nav-profile" class="flex flex-col items-center gap-1 text-slate-400">
            <span class="text-xl">👤</span>
            <span class="text-[10px]">پروفایل</span>
        </button>
    </nav>

    <script src="./app.js"></script>
</body>
</html>
