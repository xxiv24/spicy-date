<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Spicy Date 🌶️</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        :root {
            --bg-main: #0d0c1d;
            --bg-card: #161426;
            --bg-input: #1f1c33;
            --accent-red: #ff2a5f;
            --accent-gold: #ffb703;
            --accent-blue: #3a86ff;
            --text-primary: #ffffff;
            --text-secondary: #9a97b2;
            --border-color: #2a2744;
            --radius-lg: 20px;
            --radius-md: 12px;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        html, body {
            background-color: var(--bg-main);
            color: var(--text-primary);
            min-height: 100vh;
            padding-bottom: 75px;
            overflow-x: hidden;
        }

        .app-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: calc(env(safe-area-inset-top, 0px) + 10px) 18px 12px;
            background: rgba(13, 12, 29, 0.95);
            backdrop-filter: blur(10px);
            position: sticky;
            top: 0;
            z-index: 100;
            border-bottom: 1px solid var(--border-color);
        }

        .brand { display: flex; align-items: center; gap: 8px; }
        .brand-title {
            font-weight: 800; font-size: 18px;
            background: linear-gradient(45deg, #ff2a5f, #ff758c);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .vip-badge {
            padding: 6px 12px; border-radius: 20px; font-size: 11px; font-weight: 700;
            background: var(--bg-input); color: var(--text-secondary); border: 1px solid var(--border-color);
            cursor: pointer; display: flex; align-items: center; gap: 4px;
        }
        .vip-badge.active { background: linear-gradient(45deg, #ffb703, #ff8800); color: #000; border: none; }

        .main-content { padding: 15px; max-width: 480px; margin: 0 auto; }
        .tab-view { display: none; }
        .tab-view.active { display: block; animation: fadeIn 0.25s ease-in-out; }

        @keyframes fadeIn { from { opacity: 0; transform: translateY(4px); } to { opacity: 1; transform: translateY(0); } }

        .filter-bar { display: flex; gap: 10px; margin-bottom: 15px; }
        .custom-select-wrapper { flex: 1; }

        .form-input, select {
            width: 100%;
            padding: 11px 14px;
            background-color: var(--bg-card);
            border: 1px solid var(--border-color);
            color: var(--text-primary);
            border-radius: var(--radius-md);
            font-size: 13px;
            outline: none;
        }

        select option { background-color: #161426 !important; color: #ffffff !important; }

        .cards-wrapper { min-height: 480px; position: relative; }
        .dating-card {
            background: var(--bg-card);
            border-radius: var(--radius-lg);
            overflow: hidden;
            border: 1px solid var(--border-color);
            position: relative;
        }

        .card-media { position: relative; height: 360px; width: 100%; }
        .card-media img { width: 100%; height: 100%; object-fit: cover; }
        .card-gradient-overlay {
            position: absolute; bottom: 0; left: 0; right: 0; height: 50%;
            background: linear-gradient(to top, rgba(22, 20, 38, 1), transparent);
        }

        .btn-report-flag {
            position: absolute; top: 12px; left: 12px; background: rgba(0,0,0,0.5);
            border: 1px solid rgba(255,255,255,0.2); color: #fff; padding: 4px 8px;
            border-radius: 12px; font-size: 11px; cursor: pointer; backdrop-filter: blur(5px);
        }

        .card-info-content { position: absolute; bottom: 12px; right: 15px; left: 15px; }
        .card-info-content h2 { font-size: 22px; font-weight: 800; display: flex; align-items: center; gap: 8px; }
        .card-info-content .age { font-size: 18px; color: var(--text-secondary); }

        .intent-badge {
            display: inline-block; font-size: 11px; color: var(--accent-gold);
            background: rgba(255, 183, 3, 0.15); padding: 3px 8px; border-radius: 10px; margin-top: 4px;
        }
        .city-badge {
            display: inline-block; margin-top: 4px; font-size: 11px; color: #ff758c;
            background: rgba(255, 42, 95, 0.15); padding: 3px 8px; border-radius: 10px;
        }

        .card-bio { padding: 12px 15px; font-size: 13px; color: var(--text-secondary); }
        .btn-voice {
            background: rgba(255, 42, 95, 0.15); border: 1px solid var(--accent-red); color: #fff;
            padding: 10px; border-radius: 20px; font-size: 12px; margin-top: 10px; cursor: pointer; width: 100%; font-weight: bold;
        }

        /* اکشن بار کامل اکسپلور */
        .card-actions-bar { display: flex; justify-content: center; align-items: center; padding: 15px; gap: 15px; }
        .btn-circle {
            width: 50px; height: 50px; border-radius: 50%; border: none;
            display: flex; align-items: center; justify-content: center; font-size: 20px; cursor: pointer;
            transition: transform 0.1s ease;
        }
        .btn-circle:active { transform: scale(0.9); }
        .btn-rewind { background: var(--bg-input); color: var(--accent-gold); border: 1px solid var(--border-color); }
        .btn-pass { background: var(--bg-input); color: #ff4d4d; border: 1px solid var(--border-color); width: 56px; height: 56px; }
        .btn-superlike { background: var(--bg-input); color: var(--accent-blue); border: 1px solid var(--border-color); }
        .btn-like-main { background: linear-gradient(45deg, #ff2a5f, #ff758c); color: #fff; width: 56px; height: 56px; }

        /* بخش پروفایل */
        .avatar-wrapper { position: relative; width: 95px; height: 95px; margin: 0 auto 10px; cursor: pointer; }
        .avatar-wrapper img { width: 100%; height: 100%; border-radius: 50%; object-fit: cover; border: 3px solid var(--accent-red); }
        .avatar-edit-overlay {
            position: absolute; bottom: 0; right: 0; background: var(--accent-red);
            width: 28px; height: 28px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 14px;
        }

        .voice-recorder-box {
            background: var(--bg-card); border: 1px solid var(--border-color);
            padding: 10px 14px; border-radius: var(--radius-md); display: flex; align-items: center; justify-content: space-between; gap: 8px;
        }
        .btn-voice-rec { background: var(--accent-red); color: #fff; border: none; padding: 8px 12px; border-radius: 8px; font-size: 12px; font-weight: bold; cursor: pointer; }
        .btn-delete-rec { background: #e74c3c; color: #fff; border: none; padding: 8px 10px; border-radius: 8px; font-size: 11px; cursor: pointer; }
        .rec-timer { font-size: 12px; color: var(--text-secondary); }

        .toggle-box { display: flex; align-items: center; justify-content: space-between; background: var(--bg-card); padding: 12px; border-radius: var(--radius-md); border: 1px solid var(--border-color); }

        /* ناوبری پایین */
        .bottom-nav {
            position: fixed; bottom: 0; left: 0; right: 0; height: 60px;
            background: rgba(22, 20, 38, 0.96); backdrop-filter: blur(10px);
            display: flex; justify-content: space-around; align-items: center; border-top: 1px solid var(--border-color); z-index: 200;
        }
        .nav-item { background: none; border: none; color: var(--text-secondary); display: flex; flex-direction: column; align-items: center; gap: 2px; font-size: 10px; flex: 1; cursor: pointer; }
        .nav-item.active { color: var(--accent-red); font-weight: bold; }

        .form-group { margin-bottom: 14px; }
        .form-group label { display: block; font-size: 12px; color: var(--text-secondary); margin-bottom: 6px; }
        .btn-action { width: 100%; padding: 12px; border: none; border-radius: var(--radius-md); font-weight: 700; cursor: pointer; margin-top: 8px; }
        .btn-save { background: linear-gradient(45deg, #2ecc71, #27ae60); color: #fff; }
        .btn-ref { background: linear-gradient(45deg, #3a86ff, #00b4d8); color: #fff; }

        .chat-modal { position: fixed; top: 0; left: 0; right: 0; bottom: 0; background: var(--bg-main); z-index: 500; display: none; flex-direction: column; }
        .chat-modal.active { display: flex; }
        .chat-header { padding: 12px; background: var(--bg-card); display: flex; align-items: center; gap: 10px; border-bottom: 1px solid var(--border-color); }
        .chat-header img { width: 36px; height: 36px; border-radius: 50%; }
        .btn-back { background: none; border: none; color: #fff; font-size: 18px; }
        .chat-body { flex: 1; padding: 12px; overflow-y: auto; display: flex; flex-direction: column; gap: 8px; }
        .chat-bubble { max-width: 75%; padding: 8px 12px; border-radius: 12px; font-size: 13px; }
        .chat-bubble.me { background: var(--accent-red); color: #fff; align-self: flex-end; }
        .chat-bubble.them { background: var(--bg-card); color: #fff; align-self: flex-start; border: 1px solid var(--border-color); }
        .chat-footer { padding: 10px; background: var(--bg-card); display: flex; gap: 8px; }
        .chat-footer input { flex: 1; background: var(--bg-input); border: 1px solid var(--border-color); padding: 8px 12px; border-radius: 20px; color: #fff; outline: none; }
        .btn-send { background: var(--accent-red); border: none; width: 36px; height: 36px; border-radius: 50%; color: #fff; }

        .empty-state { text-align: center; padding: 40px 15px; color: var(--text-secondary); }
    </style>
</head>
<body>

    <header class="app-header">
        <div class="brand">
            <span class="brand-icon">🌶️</span>
            <span class="brand-title">Spicy Date</span>
        </div>
        <div id="vip-status-badge" class="vip-badge" onclick="buyVipWithStars()">
            <span>⭐️</span> ارتقاء به VIP
        </div>
    </header>

    <main class="main-content">

        <!-- تب ۱: اکسپلور -->
        <section id="tab-cards" class="tab-view active">
            <div class="filter-bar">
                <div class="custom-select-wrapper">
                    <select id="filter-gender" onchange="fetchSuggestedUsers()">
                        <option value="all">همه جنسیت‌ها 👥</option>
                        <option value="female">دختر 👧</option>
                        <option value="male">پسر 👦</option>
                    </select>
                </div>
                <div class="custom-select-wrapper">
                    <select id="filter-city" onchange="fetchSuggestedUsers()">
                        <option value="all">همه شهرها 📍</option>
                    </select>
                </div>
            </div>

            <div id="cards-container" class="cards-wrapper">
                <!-- کارت‌ها توسط JS رندر می‌شوند -->
            </div>
        </section>

        <!-- تب ۲: علاقه‌مندی‌ها -->
        <section id="tab-favorites" class="tab-view">
            <div class="section-title" style="margin-bottom: 12px;">
                <h3>علاقه‌مندی‌های شما 🔥</h3>
                <p style="font-size: 12px; color: var(--text-secondary);">کسانی که لایک کرده‌اید یا با آن‌ها مچ شده‌اید</p>
            </div>
            <div id="favorites-container" style="display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px;"></div>
        </section>

        <!-- تب ۳: گفتگوها -->
        <section id="tab-chats" class="tab-view">
            <div class="section-title" style="margin-bottom: 12px;">
                <h3>گفتگوها 💬</h3>
            </div>
            <div id="chats-container">
                <div class="empty-state">
                    <h4>هنوز گفتگویی ندارید!</h4>
                    <p style="font-size: 12px; margin-top: 5px;">روی کارت‌های اکسپلور لایک بزنید تا مچ شوید.</p>
                </div>
            </div>
        </section>

        <!-- تب ۴: پروفایل -->
        <section id="tab-profile" class="tab-view">
            <div style="text-align: center; margin-bottom: 15px;">
                <div class="avatar-wrapper" onclick="document.getElementById('input-avatar-file').click()">
                    <img id="profile-avatar" src="https://images.unsplash.com/photo-1534528741775-53994a69daeb?auto=format&fit=crop&w=400&q=80" alt="Avatar">
                    <div class="avatar-edit-overlay">📷</div>
                </div>
                <input type="file" id="input-avatar-file" accept="image/*" style="display: none;" onchange="handleAvatarChange(event)">
                <h3 id="profile-name-display">پروفایل من</h3>
            </div>

            <form id="profile-form" onsubmit="event.preventDefault(); saveProfile();">
                <div class="form-group">
                    <label>نام نمایش / آیدی</label>
                    <input type="text" id="user-display-name" class="form-input" placeholder="نام شما...">
                </div>

                <div class="form-group">
                    <label>جنسیت شما</label>
                    <select id="user-gender" class="form-input">
                        <option value="male">پسر 👦</option>
                        <option value="female">دختر 👧</option>
                    </select>
                </div>

                <div class="form-group">
                    <label>شهر محل سکونت</label>
                    <select id="user-city" class="form-input"></select>
                </div>

                <div class="form-group">
                    <label>هدف از ارتباط (Intent)</label>
                    <select id="user-intent" class="form-input">
                        <option value="آشنایی و ازدواج 💍">آشنایی و ازدواج 💍</option>
                        <option value="دوستی و چت ☕">دوستی و چت ☕</option>
                        <option value="کافه‌گردی و سفر ✈️">کافه‌گردی و سفر ✈️</option>
                    </select>
                </div>

                <div class="form-group">
                    <div class="toggle-box">
                        <span style="font-size: 12px;">حالت روح (مخفی ماندن پروفایل 👻)</span>
                        <input type="checkbox" id="user-incognito">
                    </div>
                </div>

                <div class="form-group">
                    <label>ضبط صدای معرفی (حداکثر ۱۵ ثانیه 🎙️)</label>
                    <div class="voice-recorder-box">
                        <button type="button" id="btn-record-voice" onclick="toggleVoiceRecord()" class="btn-voice-rec">
                            🎤 شروع ضبط
                        </button>
                        <span id="voice-timer" class="rec-timer">00:00</span>
                        <button type="button" id="btn-delete-voice" onclick="deleteVoice()" class="btn-delete-rec" style="display: none;">
                            🗑 حذف ویس
                        </button>
                    </div>
                </div>

                <div class="form-group">
                    <label>درباره من (بیوگرافی)</label>
                    <textarea id="user-bio" rows="3" class="form-input" placeholder="یک جمله جذاب درباره خودت بنویس..."></textarea>
                </div>

                <button type="submit" class="btn-action btn-save">💾 ذخیره تغییرات</button>
                <button type="button" class="btn-action btn-ref" onclick="shareReferralLink()">🔗 دعوت از دوستان (+VIP)</button>
            </form>
        </section>

    </main>

    <nav class="bottom-nav">
        <button class="nav-item active" data-tab="cards"><div style="font-size:16px;">🔥</div><span>اکسپلور</span></button>
        <button class="nav-item" data-tab="favorites"><div style="font-size:16px;">❤️</div><span>علاقه‌ها</span></button>
        <button class="nav-item" data-tab="chats"><div style="font-size:16px;">💬</div><span>گفتگوها</span></button>
        <button class="nav-item" data-tab="profile"><div style="font-size:16px;">👤</div><span>پروفایل</span></button>
    </nav>

    <div id="chat-modal" class="chat-modal">
        <div class="chat-header">
            <button onclick="closeChat()" class="btn-back">➔</button>
            <img id="chat-user-avatar" src="" alt="">
            <span id="chat-user-name">نام کاربر</span>
        </div>
        <div id="chat-messages" class="chat-body"></div>
        <div class="chat-footer">
            <input type="text" id="chat-input" placeholder="پیامی بنویسید...">
            <button onclick="sendChatMessage()" class="btn-send">🚀</button>
        </div>
    </div>

    <script src="app.js"></script>
</body>
</html>
