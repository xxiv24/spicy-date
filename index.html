<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Spicy Date 🌶️</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        :root {
            --bg-main: #0a0915;
            --bg-card: #151326;
            --bg-pill: rgba(255, 255, 255, 0.08);
            --accent-red: #ff2a5f;
            --accent-gold: #ffb703;
            --accent-blue: #3a86ff;
            --text-primary: #ffffff;
            --text-secondary: #8e8b9e;
            --border-color: rgba(255, 255, 255, 0.08);
            --radius-pill: 20px;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            -webkit-tap-highlight-color: transparent;
            user-select: none;
        }

        html, body {
            background-color: var(--bg-main);
            color: var(--text-primary);
            height: 100vh;
            width: 100vw;
            overflow: hidden; /* جلوگیری از اسکرول اضافی و فیت کامل صفحه */
            position: relative;
        }

        /* لودینگ فلفل مینی‌مال مثل نمونه */
        #splash-screen {
            position: fixed;
            inset: 0;
            background-color: var(--bg-main);
            z-index: 9999;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            transition: opacity 0.4s ease;
        }

        .pepper-loader {
            font-size: 70px;
            animation: pulsePepper 1s infinite ease-in-out alternate;
            filter: drop-shadow(0 0 15px rgba(255, 42, 95, 0.5));
        }

        @keyframes pulsePepper {
            0% { transform: scale(0.9); opacity: 0.7; }
            100% { transform: scale(1.1); opacity: 1; }
        }

        /* بک‌گراند نويز/ستاره‌ای نا محسوس */
        #particle-canvas {
            position: absolute;
            inset: 0;
            pointer-events: none;
            z-index: 1;
        }

        /* هدر کاملاً فیت در بالاترین قسمت (Safe Area) */
        .app-header {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            padding-top: max(env(safe-area-inset-top), 12px);
            padding-left: 16px;
            padding-right: 16px;
            padding-bottom: 8px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            z-index: 100;
            background: linear-gradient(to bottom, rgba(10, 9, 21, 0.9), transparent);
        }

        .header-left {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .chat-pill-btn {
            background: var(--bg-pill);
            border: 1px solid var(--border-color);
            color: #fff;
            padding: 6px 14px;
            border-radius: var(--radius-pill);
            font-size: 12px;
            font-weight: 600;
            backdrop-filter: blur(10px);
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 5px;
        }

        .stats-group {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .stat-pill {
            background: var(--bg-pill);
            border: 1px solid var(--border-color);
            border-radius: var(--radius-pill);
            padding: 6px 12px;
            font-size: 12px;
            font-weight: 700;
            display: flex;
            align-items: center;
            gap: 5px;
            backdrop-filter: blur(10px);
        }

        .stat-pill.energy { color: #ff758c; }
        .stat-pill.stars { color: var(--accent-gold); }

        /* بدنه اصلی برنامه */
        .main-container {
            position: absolute;
            top: calc(max(env(safe-area-inset-top), 12px) + 45px);
            bottom: calc(max(env(safe-area-inset-bottom), 10px) + 65px);
            left: 0;
            right: 0;
            overflow-y: auto;
            padding: 12px 16px;
            z-index: 10;
        }

        .tab-view { display: none; }
        .tab-view.active { display: block; }

        /* کارت‌ها و المان‌ها */
        .dating-card {
            background: var(--bg-card);
            border: 1px solid var(--border-color);
            border-radius: 24px;
            overflow: hidden;
            height: 100%;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }

        .card-media {
            position: relative;
            flex: 1;
            width: 100%;
            min-height: 320px;
        }

        .card-media img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .card-info {
            position: absolute;
            bottom: 0;
            left: 0;
            right: 0;
            padding: 16px;
            background: linear-gradient(to top, var(--bg-card), transparent);
        }

        .card-actions {
            display: flex;
            justify-content: space-around;
            padding: 12px;
            background: var(--bg-card);
        }

        .btn-act {
            width: 50px;
            height: 50px;
            border-radius: 50%;
            border: none;
            background: var(--bg-pill);
            color: #fff;
            font-size: 20px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .btn-act.like { background: linear-gradient(45deg, #ff2a5f, #ff758c); }

        /* نوار ناوبری پایین دقیقاً مثل نمونه */
        .bottom-nav {
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            padding-bottom: max(env(safe-area-inset-bottom), 8px);
            height: calc(55px + max(env(safe-area-inset-bottom), 8px));
            background: rgba(15, 14, 28, 0.95);
            backdrop-filter: blur(15px);
            display: flex;
            justify-content: space-around;
            align-items: center;
            border-top: 1px solid var(--border-color);
            z-index: 100;
        }

        .nav-btn {
            background: none;
            border: none;
            color: var(--text-secondary);
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 3px;
            font-size: 10px;
            cursor: pointer;
            flex: 1;
        }

        .nav-btn.active { color: #a855f7; font-weight: bold; }
        .nav-btn .icon { font-size: 18px; }

        /* مودال دیلی چک */
        .modal-overlay {
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0.85);
            backdrop-filter: blur(12px);
            z-index: 500;
            display: none;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .modal-overlay.active { display: flex; }

        .daily-box {
            background: var(--bg-card);
            border: 1px solid var(--border-color);
            border-radius: 20px;
            padding: 20px;
            width: 100%;
            max-width: 360px;
            text-align: center;
        }

        .modal-top-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 15px;
        }

        .btn-back {
            background: var(--bg-pill);
            border: 1px solid var(--border-color);
            color: #fff;
            padding: 5px 12px;
            border-radius: 12px;
            font-size: 11px;
            cursor: pointer;
        }

        .daily-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 8px;
            margin: 15px 0;
        }

        .daily-slot {
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            padding: 8px 4px;
            display: flex;
            flex-direction: column;
            align-items: center;
            font-size: 10px;
        }

        .daily-slot.claimed { background: rgba(46, 204, 113, 0.2); border-color: #2ecc71; color: #2ecc71; }
        .daily-slot.active { border-color: var(--accent-gold); box-shadow: 0 0 10px rgba(255, 183, 3, 0.3); }

        .btn-claim {
            width: 100%;
            padding: 12px;
            border: none;
            border-radius: 12px;
            background: linear-gradient(45deg, #ff2a5f, #ff758c);
            color: #fff;
            font-weight: bold;
            font-size: 13px;
            cursor: pointer;
        }

        .btn-claim:disabled { background: var(--bg-pill); color: var(--text-secondary); cursor: not-allowed; }
    </style>
</head>
<body>

    <!-- لودینگ اختصاصی -->
    <div id="splash-screen">
        <div class="pepper-loader">🌶️</div>
    </div>

    <canvas id="particle-canvas"></canvas>

    <!-- هدر فوقانی دقیقاً مشابه عکس نمونه شما -->
    <header class="app-header">
        <div class="header-left">
            <button class="chat-pill-btn" onclick="switchTab('chats')">
                <span>💬</span> Chat
            </button>
        </div>
        <div class="stats-group">
            <div class="stat-pill energy" onclick="openDailyModal()">
                <span>⚡</span>
                <span id="txt-energy">30</span>
            </div>
            <div class="stat-pill stars" onclick="openDailyModal()">
                <span>⭐</span>
                <span id="txt-stars">0</span>
            </div>
        </div>
    </header>

    <!-- محتوای اصلی برنامه‌ام -->
    <main class="main-container">
        <!-- تب اکسپلور -->
        <section id="tab-cards" class="tab-view active">
            <div class="dating-card">
                <div class="card-media">
                    <img src="https://images.unsplash.com/photo-1494790108377-be9c29b29330?auto=format&fit=crop&w=600&q=80" alt="User">
                    <div class="card-info">
                        <h3>سارا، ۲۳ 📍 بندرعباس</h3>
                        <p style="font-size:11px; color:var(--text-secondary); margin-top:4px;">علاقه‌مند به دریا و عکاسی 📸</p>
                    </div>
                </div>
                <div class="card-actions">
                    <button class="btn-act">✖</button>
                    <button class="btn-act like">🔥</button>
                </div>
            </div>
        </section>

        <!-- تب گفتگوها -->
        <section id="tab-chats" class="tab-view">
            <h3 style="margin-bottom:10px;">چت‌های شما 💬</h3>
            <p style="font-size:12px; color:var(--text-secondary);">هنوز پیامی ندارید.</p>
        </section>

        <!-- سایر تب‌ها... -->
    </main>

    <!-- مودال Daily Check-in با دکمه بازگشت و منطق ورود روزانه -->
    <div id="daily-modal" class="modal-overlay">
        <div class="daily-box">
            <div class="modal-top-bar">
                <button class="btn-back" onclick="closeDailyModal()">❮ بازگشت</button>
                <h4 style="font-size: 14px;">پاداش ورود روزانه 📅</h4>
                <div style="width: 40px;"></div>
            </div>
            <p style="font-size: 11px; color: var(--text-secondary);">هر روز سر بزنید تا ستاره و انرژی رایگان دریافت کنید.</p>

            <div id="daily-grid" class="daily-grid"></div>

            <button id="btn-claim-reward" class="btn-claim" onclick="claimDaily()">دریافت پاداش امروز 🎉</button>
        </div>
    </div>

    <!-- منوی ناوبری پایین (تطبیق‌یافته با آیکون‌های نمونه) -->
    <nav class="bottom-nav">
        <button class="nav-btn active" onclick="switchTab('cards')">
            <span class="icon">⚔️</span>
            <span>PvP</span>
        </button>
        <button class="nav-btn" onclick="switchTab('cards')">
            <span class="icon">🍀</span>
            <span>Games</span>
        </button>
        <button class="nav-btn" onclick="openDailyModal()">
            <span class="icon">🏆</span>
            <span>Season</span>
        </button>
        <button class="nav-btn" onclick="openDailyModal()">
            <span class="icon">📜</span>
            <span>Tasks</span>
        </button>
        <button class="nav-btn" onclick="switchTab('chats')">
            <span class="icon">👤</span>
            <span>Profile</span>
        </button>
    </nav>

    <script src="app.js"></script>
</body>
</html>
