<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Spicy Date 🌶️</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: Tahoma, sans-serif; }
        body { background-color: #121218; color: #ffffff; padding-bottom: 70px; }
        .header { display: flex; justify-content: space-between; align-items: center; padding: 15px; border-bottom: 1px solid #222; }
        .badge { padding: 4px 10px; border-radius: 12px; font-size: 12px; background: #333; }
        .badge.vip { background: #ffd700; color: #000; font-weight: bold; }
        
        .tab-view { display: none; padding: 15px; }
        .tab-view.active { display: block; }
        
        /* کارت‌ها */
        .user-card { background: #1e1e26; border-radius: 16px; overflow: hidden; margin-bottom: 20px; box-shadow: 0 4px 10px rgba(0,0,0,0.3); }
        .card-img { width: 100%; height: 320px; object-fit: cover; display: block; }
        .card-info { padding: 15px; }
        .city-tag { font-size: 14px; color: #aaa; font-weight: normal; }
        .btn-like { width: 100%; padding: 12px; background: #ff2a5f; color: white; border: none; border-radius: 10px; margin-top: 10px; font-weight: bold; cursor: pointer; }
        
        /* فرم پروفایل */
        .form-group { margin-bottom: 15px; }
        .form-group label { display: block; margin-bottom: 5px; font-size: 14px; color: #bbb; }
        .form-group select, .form-group textarea { width: 100%; padding: 10px; background: #1e1e26; border: 1px solid #333; color: white; border-radius: 8px; }
        .btn-save { width: 100%; padding: 12px; background: #4caf50; color: white; border: none; border-radius: 10px; font-weight: bold; cursor: pointer; }

        /* منوی پایین */
        .bottom-nav { position: fixed; bottom: 0; left: 0; right: 0; height: 60px; background: #181820; display: flex; justify-content: space-around; align-items: center; border-top: 1px solid #282830; }
        .nav-item { color: #888; text-align: center; font-size: 11px; cursor: pointer; text-decoration: none; flex: 1; }
        .nav-item.active { color: #ff2a5f; font-weight: bold; }
        .nav-item span { display: block; font-size: 18px; margin-bottom: 2px; }
    </style>
</head>
<body>

    <div class="header">
        <span id="vip-status-badge" class="badge">کاربر عادی ⭐️</span>
        <h2>Spicy Date 🌶️</h2>
    </div>

    <!-- تب ۱: کارت‌ها (اکسپلور) -->
    <div id="tab-cards" class="tab-view active">
        <div id="cards-container">
            <div class="loading">در حال دریافت اطلاعات...</div>
        </div>
    </div>

    <!-- تب ۲: علاقه‌مندی‌ها -->
    <div id="tab-favorites" class="tab-view">
        <div id="favorites-container">
            <p class="empty-msg">لیست علاقه‌مندی‌های شما خالی است.</p>
        </div>
    </div>

    <!-- تب ۳: گفتگوها -->
    <div id="tab-chats" class="tab-view">
        <p style="text-align: center; color: #888; margin-top: 40px;">هنوز مسابقه‌ای (Match) شکل نگرفته است.</p>
    </div>

    <!-- تب ۴: پروفایل -->
    <div id="tab-profile" class="tab-view">
        <div class="form-group">
            <label>جنسیت شما:</label>
            <select id="user-gender">
                <option value="male">پسر 👦</option>
                <option value="female">دختر 👧</option>
            </select>
        </div>
        <div class="form-group">
            <label>شهر شما:</label>
            <select id="user-city">
                <option value="بندرعباس">بندرعباس</option>
                <option value="تهران">تهران</option>
                <option value="شیراز">شیراز</option>
                <option value="اصفهان">اصفهان</option>
                <option value="مشهد">مشهد</option>
            </select>
        </div>
        <div class="form-group">
            <label>درباره من (بیوگرافی):</label>
            <textarea id="user-bio" rows="3" placeholder="توضیح کوتاهی درباره خودتان بنویسید..."></textarea>
        </div>
        <button onclick="saveProfile()" class="btn-save">ذخیره تغییرات 💾</button>
    </div>

    <!-- منوی ناوبری پایین -->
    <div class="bottom-nav">
        <div class="nav-item active" data-tab="cards">
            <span>🔥</span> کارت‌ها
        </div>
        <div class="nav-item" data-tab="favorites">
            <span>❤️</span> علاقه مندی‌ها
        </div>
        <div class="nav-item" data-tab="chats">
            <span>💬</span> گفتگوها
        </div>
        <div class="nav-item" data-tab="profile">
            <span>👤</span> پروفایل
        </div>
    </div>

    <script src="app.js"></script>
</body>
</html>
