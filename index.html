<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Spicy Date 🌶️</title>
    <!-- تلگرام SDK -->
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <!-- استایل Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body {
            font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
        }
    </style>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen flex flex-col items-center p-4 pb-24 select-none">

    <!-- لوگو و هدر -->
    <header class="w-full max-w-md flex justify-between items-center py-3 border-b border-slate-800/80 mb-4">
        <h1 class="text-2xl font-black text-transparent bg-clip-text bg-gradient-to-r from-rose-500 via-pink-500 to-amber-400">
            Spicy Date 🌶️
        </h1>
        <span id="user-city-badge" class="text-xs font-semibold px-2.5 py-1 bg-slate-900 text-rose-400 rounded-full border border-rose-500/20">
            بندرعباس
        </span>
    </header>

    <!-- محتوای اصلی صفحات -->
    <main class="w-full max-w-md flex-1 flex flex-col items-center justify-start">
        
        <!-- تب ۱: اکسپلور و کارت‌ها -->
        <section id="tab-explore" class="w-full">
            <div id="cards-container" class="w-full">
                <div class="flex flex-col items-center justify-center py-12 text-slate-500">
                    <div class="w-8 h-8 border-2 border-rose-500 border-t-transparent rounded-full animate-spin mb-3"></div>
                    <p class="text-sm font-medium">در حال دریافت پیشنهادات اسپایسی...</p>
                </div>
            </div>
        </section>

        <!-- تب ۲: چت شبانه (ناشناس) -->
        <section id="tab-night" class="w-full hidden">
            <div class="bg-slate-900/80 border border-indigo-900/50 rounded-3xl p-6 text-center shadow-xl">
                <div class="text-4xl mb-3">🌙</div>
                <h2 class="text-xl font-bold text-indigo-400 mb-2">چت ناشناس شبانه</h2>
                <p class="text-xs text-slate-400 mb-6">مکالمه ۳ دقیقه‌ای کاملاً ناشناس با کاربران نزدیک شما</p>
                <button onclick="alert('در حال جستجوی هم‌صحبت ناشناس...')" class="w-full py-3 bg-gradient-to-r from-indigo-600 to-purple-600 text-white font-bold rounded-2xl shadow-lg">
                    شروع گفتگو (۳ دقیقه)
                </button>
            </div>
        </section>

        <!-- تب ۳: پیام‌ها و Matchها -->
        <section id="tab-chats" class="w-full hidden">
            <div class="bg-slate-900/50 border border-slate-800 rounded-3xl p-6 text-center">
                <p class="text-slate-400 text-sm">هنوز مسابقه‌ای (Match) شکل نگرفته است.</p>
            </div>
        </section>

        <!-- تب ۴: پروفایل شخصی -->
        <section id="tab-profile" class="w-full hidden">
            <div class="bg-slate-900/90 border border-slate-800 rounded-3xl p-6 text-center">
                <div class="w-20 h-20 bg-slate-800 rounded-full mx-auto mb-3 flex items-center justify-center text-3xl">👤</div>
                <h2 class="text-lg font-bold text-white mb-1">پروفایل من</h2>
                <p class="text-xs text-rose-400 mb-4">کاربر اسپایسی</p>
            </div>
        </section>

    </main>

    <!-- منوی پایینی (Navigation Bar) -->
    <nav class="fixed bottom-0 left-0 right-0 bg-slate-900/95 border-t border-slate-800/80 backdrop-blur-lg px-4 py-2 z-50 flex justify-around items-center max-w-md mx-auto">
        <button onclick="switchTab('explore')" id="nav-explore" class="flex flex-col items-center gap-1 text-rose-500">
            <span class="text-xl">🔥</span>
            <span class="text-[10px] font-medium">کارت‌ها</span>
        </button>

        <button onclick="switchTab('night')" id="nav-night" class="flex flex-col items-center gap-1 text-slate-400">
            <span class="text-xl">🌙</span>
            <span class="text-[10px] font-medium">چت شبانه</span>
        </button>

        <button onclick="switchTab('chats')" id="nav-chats" class="flex flex-col items-center gap-1 text-slate-400">
            <span class="text-xl">💬</span>
            <span class="text-[10px] font-medium">گفتگوها</span>
        </button>

        <button onclick="switchTab('profile')" id="nav-profile" class="flex flex-col items-center gap-1 text-slate-400">
            <span class="text-xl">👤</span>
            <span class="text-[10px] font-medium">پروفایل</span>
        </button>
    </nav>

    <!-- اسکریپت اصلی app.js -->
    <script src="./app.js"></script>
</body>
</html>
