<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Spicy Date 🌶️</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        :root {
            --bg-main: #0d0c1d;
            --bg-card: #161426;
            --bg-input: #1f1c33;
            --accent-red: #ff2a5f;
            --accent-gold: #ffb703;
            --accent-blue: #3a86ff;
            --text-primary: #ffffff;
            --text-secondary: #9a97b2;
            --border-color: #2a2744;
            --radius-lg: 20px;
            --radius-md: 12px;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; -webkit-tap-highlight-color: transparent; }
        html, body { background-color: var(--bg-main); color: var(--text-primary); min-height: 100vh; padding-bottom: 75px; overflow-x: hidden; }

        /* نوتیفیکیشن اختصاصی UI */
        .custom-toast {
            position: fixed; top: 20px; left: 50%; transform: translateX(-50%) translateY(-100px);
            background: rgba(31, 28, 51, 0.95); border: 1px solid var(--accent-red); color: #fff;
            padding: 12px 20px; border-radius: 30px; font-size: 13px; font-weight: bold;
            box-shadow: 0 10px 25px rgba(0,0,0,0.5); backdrop-filter: blur(10px); z-index: 1000;
            transition: transform 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275); display: flex; align-items: center; gap: 8px;
        }
        .custom-toast.show { transform: translateX(-50%) translateY(0); }

        .app-header { display: flex; justify-content: space-between; align-items: center; padding: 12px 18px; background: rgba(13, 12, 29, 0.95); backdrop-filter: blur(10px); position: sticky; top: 0; z-index: 100; border-bottom: 1px solid var(--border-color); }
        .brand-title { font-weight: 800; font-size: 18px; background: linear-gradient(45deg, #ff2a5f, #ff758c); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
        .vip-badge { padding: 6px 12px; border-radius: 20px; font-size: 11px; font-weight: 700; background: var(--bg-input); color: var(--text-secondary); border: 1px solid var(--border-color); cursor: pointer; }
        .vip-badge.active { background: linear-gradient(45deg, #ffb703, #ff8800); color: #000; border: none; }

        .main-content { padding: 15px; max-width: 480px; margin: 0 auto; }
        .tab-view { display: none; }
        .tab-view.active { display: block; }

        .filter-bar { display: flex; gap: 10px; margin-bottom: 15px; }
        .form-input, select { width: 100%; padding: 11px 14px; background-color: var(--bg-card); border: 1px solid var(--border-color); color: var(--text-primary); border-radius: var(--radius-md); font-size: 13px; outline: none; }
        select option { background-color: #161426 !important; color: #ffffff !important; }

        .cards-wrapper { min-height: 480px; position: relative; }
        .dating-card { background: var(--bg-card); border-radius: var(--radius-lg); overflow: hidden; border: 1px solid var(--border-color); position: relative; }
        .card-media { position: relative; height: 360px; width: 100%; }
        .card-media img { width: 100%; height: 100%; object-fit: cover; }
        .card-gradient-overlay { position: absolute; bottom: 0; left: 0; right: 0; height: 50%; background: linear-gradient(to top, rgba(22, 20, 38, 1), transparent); }
        .btn-report-flag { position: absolute; top: 12px; left: 12px; background: rgba(0,0,0,0.5); border: 1px solid rgba(255,255,255,0.2); color: #fff; padding: 4px 8px; border-radius: 12px; font-size: 11px; cursor: pointer; }

        .card-info-content { position: absolute; bottom: 12px; right: 15px; left: 15px; }
        .card-info-content h2 { font-size: 22px; font-weight: 800; display: flex; align-items: center; gap: 8px; }
        .card-info-content .age { font-size: 18px; color: var(--text-secondary); }
        .intent-badge, .city-badge { display: inline-block; font-size: 11px; padding: 3px 8px; border-radius: 10px; margin-top: 4px; }
        .intent-badge { color: var(--accent-gold); background: rgba(255, 183, 3, 0.15); }
        .city-badge { color: #ff758c; background: rgba(255, 42, 95, 0.15); }

        .card-bio { padding: 12px 15px; font-size: 13px; color: var(--text-secondary); }
        .btn-voice { background: rgba(255, 42, 95, 0.15); border: 1px solid var(--accent-red); color: #fff; padding: 10px; border-radius: 20px; font-size: 12px; margin-top: 10px; cursor: pointer; width: 100%; font-weight: bold; }

        .card-actions-bar { display: flex; justify-content: center; align-items: center; padding: 15px; gap: 15px; }
        .btn-circle { width: 50px; height: 50px; border-radius: 50%; border: none; display: flex; align-items: center; justify-content: center; font-size: 20px; cursor: pointer; }
        .btn-rewind { background: var(--bg-input); color: var(--accent-gold); border: 1px solid var(--border-color); }
        .btn-pass { background: var(--bg-input); color: #ff4d4d; border: 1px solid var(--border-color); width: 56px; height: 56px; }
        .btn-superlike { background: var(--bg-input); color: var(--accent-blue); border: 1px solid var(--border-color); }
        .btn-like-main { background: linear-gradient(45deg, #ff2a5f, #ff758c); color: #fff; width: 56px; height: 56px; }

        .avatar-wrapper { position: relative; width: 95px; height: 95px; margin: 0 auto 10px; cursor: pointer; }
        .avatar-wrapper img { width: 100%; height: 100%; border-radius: 50%; object-fit: cover; border: 3px solid var(--accent-red); }
        .avatar-edit-overlay { position: absolute; bottom: 0; right: 0; background: var(--accent-red); width: 28px; height: 28px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 14px; }

        .bottom-nav { position: fixed; bottom: 0; left: 0; right: 0; height: 60px; background: rgba(22, 20, 38, 0.96); backdrop-filter: blur(10px); display: flex; justify-content: space-around; align-items: center; border-top: 1px solid var(--border-color); z-index: 200; }
        .nav-item { background: none; border: none; color: var(--text-secondary); display: flex; flex-direction: column; align-items: center; gap: 2px; font-size: 10px; flex: 1; cursor: pointer; }
        .nav-item.active { color: var(--accent-red); font-weight: bold; }

        .form-group { margin-bottom: 14px; }
        .form-group label { display: block; font-size: 12px; color: var(--text-secondary); margin-bottom: 6px; }
        .btn-action { width: 100%; padding: 12px; border: none; border-radius: var(--radius-md); font-weight: 700; cursor: pointer; margin-top: 8px; }
        .btn-save { background: linear-gradient(45deg, #2ecc71, #27ae60); color: #fff; }
        .btn-ref { background: linear-gradient(45deg, #3a86ff, #00b4d8); color: #fff; }
        .btn-channel { background: linear-gradient(45deg, #ffb703, #ff8800); color: #000; }

        /* پاپ‌آپ خرید VIP */
        .vip-modal { position: fixed; top: 0; left: 0; right: 0; bottom: 0; background: rgba(0,0,0,0.85); backdrop-filter: blur(8px); z-index: 600; display: none; align-items: center; justify-content: center; padding: 20px; }
        .vip-modal.active { display: flex; }
        .vip-modal-content { background: var(--bg-card); border: 1px solid var(--accent-gold); border-radius: var(--radius-lg); padding: 20px; width: 100%; max-width: 400px; text-align: center; }
        .vip-plan-card { background: var(--bg-input); border: 1px solid var(--border-color); border-radius: var(--radius-md); padding: 15px; margin: 10px 0; display: flex; justify-content: space-between; align-items: center; cursor: pointer; }
        .vip-plan-card:hover { border-color: var(--accent-gold); }
    </style>
</head>
<body>

    <div id="custom-toast" class="custom-toast"><span id="toast-icon">✨</span><span id="toast-text">پیام</span></div>

    <header class="app-header">
        <div class="brand"><span class="brand-title">🌶️ Spicy Date</span></div>
        <div id="vip-status-badge" class="vip-badge" onclick="openVipModal()">⭐️ ارتقاء به VIP</div>
    </header>

    <main class="main-content">
        <section id="tab-cards" class="tab-view active">
            <div class="filter-bar">
                <select id="filter-gender" onchange="fetchSuggestedUsers()"><option value="all">همه جنسیت‌ها 👥</option><option value="female">دختر 👧</option><option value="male">پسر 👦</option></select>
                <select id="filter-city" onchange="fetchSuggestedUsers()"><option value="all">همه شهرها 📍</option></select>
            </div>
            <div id="cards-container" class="cards-wrapper"></div>
        </section>

        <section id="tab-profile" class="tab-view">
            <div style="text-align: center; margin-bottom: 15px;">
                <div class="avatar-wrapper" onclick="document.getElementById('input-avatar-file').click()">
                    <img id="profile-avatar" src="https://images.unsplash.com/photo-1534528741775-53994a69daeb?auto=format&fit=crop&w=400&q=80">
                    <div class="avatar-edit-overlay">📷</div>
                </div>
                <input type="file" id="input-avatar-file" accept="image/*" style="display: none;" onchange="handleAvatarChange(event)">
                <h3 id="profile-name-display">پروفایل من</h3>
            </div>

            <form id="profile-form" onsubmit="event.preventDefault(); saveProfile();">
                <div class="form-group"><label>نام نمایش</label><input type="text" id="user-display-name" class="form-input"></div>
                <div class="form-group"><label>جنسیت</label><select id="user-gender" class="form-input"><option value="male">پسر 👦</option><option value="female">دختر 👧</option></select></div>
                <div class="form-group"><label>شهر</label><select id="user-city" class="form-input"></select></div>
                <div class="form-group"><label>هدف ارتباط</label><select id="user-intent" class="form-input"><option value="آشنایی و ازدواج 💍">آشنایی و ازدواج 💍</option><option value="دوستی و چت ☕">دوستی و چت ☕</option></select></div>
                <div class="form-group"><label>درباره من</label><textarea id="user-bio" rows="3" class="form-input"></textarea></div>

                <button type="submit" class="btn-action btn-save">💾 ذخیره تغییرات</button>
                <button type="button" class="btn-action btn-ref" onclick="shareReferralLink()">🔗 دعوت از دوستان (+VIP)</button>
                <button type="button" class="btn-action btn-channel" onclick="joinChannel()">📢 عضویت در کانال ما</button>
            </form>
        </section>
    </main>

    <!-- مودال خرید VIP -->
    <div id="vip-modal" class="vip-modal">
        <div class="vip-modal-content">
            <h3 style="color: var(--accent-gold); margin-bottom: 10px;">👑 ارتقاء به حساب VIP</h3>
            <p style="font-size: 12px; color: var(--text-secondary); margin-bottom: 15px;">دسترسی به لایک نامحدود، بازگردانی کارت و حالت روح</p>
            
            <div class="vip-plan-card" onclick="processPayment(100, 30)">
                <div><b>۱ ماهه</b><br><small style="color:var(--text-secondary)">عادی</small></div>
                <div style="color:var(--accent-gold); font-weight:bold;">100 ⭐️ Stars</div>
            </div>
            <div class="vip-plan-card" onclick="processPayment(250, 90)">
                <div><b>۳ ماهه</b><br><small style="color:var(--text-secondary)">پیشنهادی 🔥</small></div>
                <div style="color:var(--accent-gold); font-weight:bold;">250 ⭐️ Stars</div>
            </div>

            <button onclick="closeVipModal()" style="background:none; border:none; color:var(--text-secondary); margin-top:15px; cursor:pointer;">انصراف</button>
        </div>
    </div>

    <nav class="bottom-nav">
        <button class="nav-item active" data-tab="cards">🔥<span>اکسپلور</span></button>
        <button class="nav-item" data-tab="profile">👤<span>پروفایل</span></button>
    </nav>

    <script src="app.js"></script>
</body>
</html>
