<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Spicy Date 🌶️</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- هدر شیک و مدرن -->
    <header class="app-header">
        <div class="brand">
            <span class="brand-icon">🌶️</span>
            <span class="brand-title">Spicy Date</span>
        </div>
        <div id="vip-status-badge" class="vip-badge normal">
            <span>⭐️</span> کاربر عادی
        </div>
    </header>

    <main class="main-content">

        <!-- تب ۱: اکسپلور و سواپ کارت‌ها -->
        <section id="tab-cards" class="tab-view active">
            <!-- نوار فیلتر بالای کارت‌ها -->
            <div class="filter-bar">
                <select id="filter-gender" onchange="applyFilters()">
                    <option value="all">همه جنسیت‌ها 👥</option>
                    <option value="female">دختر 👧</option>
                    <option value="male">پسر 👦</option>
                </select>
                <select id="filter-city" onchange="applyFilters()">
                    <option value="all">همه شهرها 📍</option>
                    <option value="بندرعباس">بندرعباس</option>
                    <option value="تهران">تهران</option>
                    <option value="شیراز">شیراز</option>
                    <option value="اصفهان">اصفهان</option>
                    <option value="مشهد">مشهد</option>
                </select>
            </div>

            <!-- کانتینر کارت‌ها -->
            <div id="cards-container" class="cards-wrapper">
                <div class="loading-spinner">
                    <div class="spinner"></div>
                    <p>در حال یافتن پارتنرهای نزدیک...</p>
                </div>
            </div>
        </section>

        <!-- تب ۲: علاقه‌مندی‌ها -->
        <section id="tab-favorites" class="tab-view">
            <div class="section-title">
                <h3>علاقه‌مندی‌های شما 🔥</h3>
                <p>کسانی که لایک کرده‌اید یا شما را لایک کرده‌اند</p>
            </div>
            <div id="favorites-container" class="favorites-grid">
                <!-- دیتای رندر شده -->
            </div>
        </section>

        <!-- تب ۳: گفتگوها و مسابقه‌ها -->
        <section id="tab-chats" class="tab-view">
            <div class="section-title">
                <h3>گفتگوها 💬</h3>
                <p>با مچ‌های خود صحبت کنید</p>
            </div>
            <div id="chats-container" class="chats-list">
                <div class="empty-state">
                    <div class="empty-icon">💌</div>
                    <h4>هنوز مسابقه‌ای (Match) شکل نگرفته!</h4>
                    <p>کارت‌های بیشتری را سواپ و لایک کنید تا با افراد جدید مچ شوید.</p>
                </div>
            </div>
        </section>

        <!-- تب ۴: پروفایل کاربری -->
        <section id="tab-profile" class="tab-view">
            <div class="profile-card-header">
                <div class="avatar-wrapper">
                    <img id="profile-avatar" src="https://images.unsplash.com/photo-1534528741775-53994a69daeb?auto=format&fit=crop&w=400&q=80" alt="Avatar">
                    <span class="online-indicator"></span>
                </div>
                <h3 id="profile-name-display">پروفایل من</h3>
                <p id="profile-id-display">ID: ---</p>
            </div>

            <form id="profile-form" onsubmit="event.preventDefault(); saveProfile();">
                <div class="form-group">
                    <label>جنسیت شما</label>
                    <select id="user-gender">
                        <option value="male">پسر 👦</option>
                        <option value="female">دختر 👧</option>
                    </select>
                </div>

                <div class="form-group">
                    <label>شهر محل سکونت</label>
                    <select id="user-city">
                        <option value="بندرعباس">بندرعباس</option>
                        <option value="تهران">تهران</option>
                        <option value="شیراز">شیراز</option>
                        <option value="اصفهان">اصفهان</option>
                        <option value="مشهد">مشهد</option>
                    </select>
                </div>

                <div class="form-group">
                    <label>درباره من (بیوگرافی)</label>
                    <textarea id="user-bio" rows="3" placeholder="یک جمله جذاب درباره خودت بنویس..."></textarea>
                </div>

                <button type="submit" class="btn-action btn-save">
                    <span>💾</span> ذخیره پروفایل
                </button>
            </form>
        </section>

    </main>

    <!-- نوار ناوبری پایین صفحه (Bottom Navigation Bar) -->
    <nav class="bottom-nav">
        <button class="nav-item active" data-tab="cards">
            <div class="nav-icon">🔥</div>
            <span>اکسپلور</span>
        </button>
        <button class="nav-item" data-tab="favorites">
            <div class="nav-icon">❤️</div>
            <span>علاقه‌ها</span>
        </button>
        <button class="nav-item" data-tab="chats">
            <div class="nav-icon">💬</div>
            <span>گفتگوها</span>
        </button>
        <button class="nav-item" data-tab="profile">
            <div class="nav-icon">👤</div>
            <span>پروفایل</span>
        </button>
    </nav>

    <script src="app.js"></script>
</body>
</html>
