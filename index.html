<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Spicy Date 🌶️</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        :root {
            --bg-main: #0d0c1d;
            --bg-card: #161426;
            --bg-input: #1f1c33;
            --accent-red: #ff2a5f;
            --accent-gold: #ffb703;
            --accent-blue: #3a86ff;
            --text-primary: #ffffff;
            --text-secondary: #9a97b2;
            --border-color: #2a2744;
            --radius-lg: 20px;
            --radius-md: 12px;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        html, body {
            background-color: var(--bg-main);
            color: var(--text-primary);
            min-height: 100vh;
            padding-bottom: calc(85px + env(safe-area-inset-bottom, 0px));
            overflow-x: hidden;
        }

        /* اصلاح فاصله هدر از بالای تلگرام */
        .app-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            /* پدینگ بالا ۵۵ پیکسل اضافه شد تا زیر دکمه Close تلگرام نرود */
            padding: calc(55px + env(safe-area-inset-top, 0px)) 16px 12px;
            background: rgba(13, 12, 29, 0.98);
            backdrop-filter: blur(10px);
            position: sticky;
            top: 0;
            z-index: 100;
            border-bottom: 1px solid var(--border-color);
        }

        .brand-title {
            font-weight: 800; 
            font-size: 18px;
            background: linear-gradient(45deg, #ff2a5f, #ff758c);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .vip-badge {
            padding: 6px 12px; 
            border-radius: 20px; 
            font-size: 11px; 
            font-weight: 700;
            background: var(--bg-input); 
            color: var(--text-secondary); 
            border: 1px solid var(--border-color);
            cursor: pointer; 
            display: flex; 
            align-items: center; 
            gap: 4px;
        }
        .vip-badge.active { background: linear-gradient(45deg, #ffb703, #ff8800); color: #000; border: none; }

        .main-content { padding: 12px; max-width: 480px; margin: 0 auto; }
        .tab-view { display: none; }
        .tab-view.active { display: block; }

        .form-input, select, textarea {
            width: 100%;
            padding: 12px;
            background-color: var(--bg-card);
            border: 1px solid var(--border-color);
            color: var(--text-primary);
            border-radius: var(--radius-md);
            font-size: 13px;
            outline: none;
            appearance: none;
        }

        select option { background-color: #161426; color: #ffffff; }

        .avatar-wrapper { position: relative; width: 90px; height: 90px; margin: 0 auto 8px; cursor: pointer; }
        .avatar-wrapper img { width: 100%; height: 100%; border-radius: 50%; object-fit: cover; border: 3px solid var(--accent-red); }
        .avatar-edit-overlay {
            position: absolute; bottom: 0; right: 0; background: var(--accent-red);
            width: 26px; height: 26px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 12px;
        }

        .toggle-box { display: flex; align-items: center; justify-content: space-between; background: var(--bg-card); padding: 10px 12px; border-radius: var(--radius-md); border: 1px solid var(--border-color); }

        .bottom-nav {
            position: fixed; bottom: 0; left: 0; right: 0;
            height: calc(60px + env(safe-area-inset-bottom, 0px));
            padding-bottom: env(safe-area-inset-bottom, 0px);
            background: rgba(22, 20, 38, 0.98); backdrop-filter: blur(10px);
            display: flex; justify-content: space-around; align-items: center; border-top: 1px solid var(--border-color); z-index: 200;
        }
        .nav-item { background: none; border: none; color: var(--text-secondary); display: flex; flex-direction: column; align-items: center; gap: 2px; font-size: 10px; flex: 1; cursor: pointer; }
        .nav-item.active { color: var(--accent-red); font-weight: bold; }

        .form-group { margin-bottom: 12px; }
        .form-group label { display: block; font-size: 11px; color: var(--text-secondary); margin-bottom: 5px; }
        .btn-action { width: 100%; padding: 13px; border: none; border-radius: var(--radius-md); font-weight: 700; cursor: pointer; margin-top: 8px; font-size: 13px; }
        .btn-save { background: linear-gradient(45deg, #2ecc71, #27ae60); color: #fff; }
        .btn-ref { background: linear-gradient(45deg, #3a86ff, #00b4d8); color: #fff; }
        .btn-channel { background: linear-gradient(45deg, #ffb703, #ff8800); color: #000; }

        .custom-toast {
            position: fixed; top: 70px; left: 50%; transform: translateX(-50%) translateY(-100px);
            background: rgba(31, 28, 51, 0.95); border: 1px solid var(--accent-red); color: #fff;
            padding: 10px 18px; border-radius: 30px; font-size: 13px; font-weight: bold;
            z-index: 1000; transition: transform 0.3s ease; display: flex; align-items: center; gap: 8px; pointer-events: none;
        }
        .custom-toast.show { transform: translateX(-50%) translateY(0); }
    </style>
</head>
<body>

    <div id="custom-toast" class="custom-toast">
        <span id="toast-icon">✨</span>
        <span id="toast-text">پیام</span>
    </div>

    <header class="app-header">
        <div class="brand">
            <span class="brand-title">Spicy Date 🌶️</span>
        </div>
        <div id="vip-status-badge" class="vip-badge" onclick="openVipModal()">
            <span>⭐️</span> ارتقاء به VIP
        </div>
    </header>

    <main class="main-content">

        <!-- تب پروفایل -->
        <section id="tab-profile" class="tab-view active">
            <div style="text-align: center; margin-bottom: 12px;">
                <div class="avatar-wrapper" onclick="document.getElementById('input-avatar-file').click()">
                    <img id="profile-avatar" src="https://images.unsplash.com/photo-1534528741775-53994a69daeb?auto=format&fit=crop&w=400&q=80" alt="Avatar">
                    <div class="avatar-edit-overlay">📷</div>
                </div>
                <input type="file" id="input-avatar-file" accept="image/*" style="display: none;" onchange="handleAvatarChange(event)">
                <h3 id="profile-name-display">پروفایل من</h3>
            </div>

            <!-- حذف تگ form جهت جلوگیری از تداخل submit تلگرام -->
            <div id="profile-form-container">
                <div style="display: grid; grid-template-columns: 2fr 1fr; gap: 8px;" class="form-group">
                    <div>
                        <label>نام نمایش / آیدی</label>
                        <input type="text" id="user-display-name" class="form-input" placeholder="نام شما...">
                    </div>
                    <div>
                        <label>سن شما</label>
                        <input type="number" id="user-age" class="form-input" min="18" max="70" placeholder="۲۵">
                    </div>
                </div>

                <div class="form-group">
                    <label>جنسیت شما</label>
                    <select id="user-gender" class="form-input">
                        <option value="male">پسر 👦</option>
                        <option value="female">دختر 👧</option>
                    </select>
                </div>

                <div class="form-group">
                    <label>شهر محل سکونت</label>
                    <select id="user-city" class="form-input"></select>
                </div>

                <div class="form-group">
                    <label>هدف از ارتباط (Intent)</label>
                    <select id="user-intent" class="form-input">
                        <option value="آشنایی و ازدواج 💍">آشنایی و ازدواج 💍</option>
                        <option value="دوستی و چت ☕">دوستی و چت ☕</option>
                        <option value="کافه‌گردی و سفر ✈️">کافه‌گردی و سفر ✈️</option>
                    </select>
                </div>

                <div class="form-group">
                    <div class="toggle-box">
                        <span style="font-size: 11px;">حالت روح (مخفی ماندن پروفایل 👻)</span>
                        <input type="checkbox" id="user-incognito">
                    </div>
                </div>

                <div class="form-group">
                    <label>درباره من (بیوگرافی)</label>
                    <textarea id="user-bio" rows="2" class="form-input" placeholder="یک جمله جذاب درباره خودت بنویس..."></textarea>
                </div>

                <!-- تغییر نوع دکمه به type="button" و فراخوانی مستقیم تابع -->
                <button type="button" class="btn-action btn-save" onclick="saveProfileDirect()">💾 ذخیره تغییرات</button>
                <button type="button" class="btn-action btn-ref" onclick="shareReferralLink()">🔗 دعوت از دوستان (+VIP)</button>
                <button type="button" class="btn-action btn-channel" onclick="joinChannel()">📢 عضویت در کانال ما</button>
            </div>
        </section>

    </main>

    <nav class="bottom-nav">
        <button class="nav-item" data-tab="cards"><div style="font-size:16px;">🔥</div><span>اکسپلور</span></button>
        <button class="nav-item" data-tab="favorites"><div style="font-size:16px;">❤️</div><span>علاقه‌ها</span></button>
        <button class="nav-item" data-tab="chats"><div style="font-size:16px;">💬</div><span>گفتگوها</span></button>
        <button class="nav-item active" data-tab="profile"><div style="font-size:16px;">👤</div><span>پروفایل</span></button>
    </nav>

    <script src="app.js"></script>
</body>
</html>
